# OpenBot Web UI reverse proxy configuration
#
# The daemon serves the web client itself: the static bundle, the Team API's routes and the Team
# API's event socket all answer on one port. This proxy is a thin shell in front of it: it adds
# the security headers and the compression, and it is the only place that names the daemon's port.
#
# The port is a fixed one (OPENBOT_WEBUI_PORT, 28421 by default) and not a discovered one: the
# Team API takes a free loopback port and the daemon knows it, so the daemon forwards to it.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_origin $cors_origin {
    default $http_origin;
    "" "$scheme://$http_host";
}

# The daemon's web UI server.
upstream openbot_web_ui {
    server 127.0.0.1:28421;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Gzip Compression for lightning-fast asset loading
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # The Team API's routes, and everything else, come from the daemon. The daemon serves the
    # bundle itself and forwards the Team API to its own loopback listener, so this one upstream
    # carries the whole interface.
    location / {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        # Security headers
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(), usb=()" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;

        proxy_pass http://openbot_web_ui;
        proxy_http_version 1.1;

        # The event socket of the Team API arrives as an upgrade.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The Team API answers 426 client_update_required when the client protocol headers are
        # missing. Pass them through unchanged instead of rewriting them here, so the browser
        # decides the protocol version and the API stays the single source of truth.
        proxy_set_header OpenBot-Protocol-Version $http_openbot_protocol_version;
        proxy_set_header OpenBot-App-Version $http_openbot_app_version;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # The preflight of a cross-origin request carries no body and needs the same headers.
    location = /v1/ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass http://openbot_web_ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header OpenBot-Protocol-Version $http_openbot_protocol_version;
        proxy_set_header OpenBot-App-Version $http_openbot_app_version;
    }

    location = /v2/ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass http://openbot_web_ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header OpenBot-Protocol-Version $http_openbot_protocol_version;
        proxy_set_header OpenBot-App-Version $http_openbot_app_version;
    }
}
