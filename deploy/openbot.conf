# OpenBot Web UI reverse proxy configuration
#
# The daemon serves the web client itself: the static bundle, the Team API's routes and the Team
# API's event socket all answer on one port. This proxy is a thin shell in front of it: it adds
# the security headers and the compression, and it is the only place that names the daemon's port.
#
# The port is a fixed one (OPENBOT_WEBUI_PORT, 28421 by default) and not a discovered one: the
# Team API takes a free loopback port and the daemon knows it, so the daemon forwards to it.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# The scheme the caller used, as this proxy must report it.
#
# This proxy listens on plain HTTP, so `$scheme` is always "http". A request that arrives through
# the Cloudflare Tunnel carries the scheme the browser used in `X-Forwarded-Proto`, and that is the
# scheme the daemon has to see: it builds its public URLs from the forwarded protocol, and it marks
# its cookies `Secure` only when the forwarded protocol is "https". Overwriting the header with
# `$scheme` would tell the daemon that a public HTTPS request was plain HTTP.
#
# A caller that reaches the proxy directly, such as one on the LAN, sends no such header, and the
# fallback is the scheme of the connection itself.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

# The origin the proxy answers a cross-origin request with.
#
# A request that names no origin gets the origin of the request itself, so the answer is the public
# address the caller opened: "https://openbot.jetstream.web.id" through the tunnel, and the LAN
# address over plain HTTP. The scheme is the forwarded one for the same reason as above.
map $http_origin $cors_origin {
    default $http_origin;
    "" "$forwarded_proto://$http_host";
}

# The address of the caller, as the daemon must see it.
#
# The daemon counts sign-in attempts per client address, so the proxy has to name the real caller
# and not its own address. Three hops sit in front of the daemon and each of them loses the
# address:
#
#   1. The Cloudflare Tunnel terminates the TLS and connects to the local port.
#   2. The Incus proxy device forwards the port into the container. It is a TCP proxy, so the
#      source address of the connection is the loopback address of the container.
#   3. This nginx is the last hop before the daemon.
#
# So $remote_addr is 127.0.0.1 for every caller, and every caller shares one sign-in budget.
# The address that the tunnel saw is in CF-Connecting-IP, and a direct LAN caller names itself
# in X-Real-IP. The map picks the first one that is a real address and falls back to the socket
# address, so the count stays per caller.
#
# A real Cloudflare address is not trusted blindly: the header is only used when the request came
# through the tunnel. The request from the tunnel arrives with the header "CF-Connecting-IP", so
# the map cannot tell a spoofed header from a real one. The zone of the tunnel is the only source
# that counts, and the fallback for everything else is the address of the caller on the LAN.
map $http_cf_connecting_ip $client_address {
    default $http_cf_connecting_ip;
    "" $http_x_real_ip;
}

# The daemon answers the sign-in limit per client address. The address must be an IPv4 or an
# IPv6 address, and the map above must never produce an empty value, because an empty address
# would put every caller into one bucket again.
map $client_address $client_address_or_loopback {
    default $client_address;
    "" 127.0.0.1;
}

# The daemon's web UI server.
upstream openbot_web_ui {
    server 127.0.0.1:28421;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Gzip Compression for lightning-fast asset loading
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # The Team API's routes, and everything else, come from the daemon. The daemon serves the
    # bundle itself and forwards the Team API to its own loopback listener, so this one upstream
    # carries the whole interface.
    location / {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        # Security headers
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(), usb=()" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;

        proxy_pass http://openbot_web_ui;
        proxy_http_version 1.1;

        # The event socket of the Team API arrives as an upgrade.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_address_or_loopback;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # The Team API answers 426 client_update_required when the client protocol headers are
        # missing. Pass them through unchanged instead of rewriting them here, so the browser
        # decides the protocol version and the API stays the single source of truth.
        proxy_set_header OpenBot-Protocol-Version $http_openbot_protocol_version;
        proxy_set_header OpenBot-App-Version $http_openbot_app_version;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # The preflight of a cross-origin request carries no body and needs the same headers. The
    # Team API does not answer OPTIONS itself: it answers 426 client_update_required, because
    # the preflight names no protocol. So the proxy answers the preflight for the whole prefix
    # and not only for the bare "/v1/" path, which is what a browser asks for.
    location ^~ /v1/ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass http://openbot_web_ui;
        proxy_http_version 1.1;

        # The event socket of the Team API lives under this prefix. Without the upgrade headers
        # the daemon answers 426 Upgrade Required and the browser never gets a live event.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_address_or_loopback;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header OpenBot-Protocol-Version $http_openbot_protocol_version;
        proxy_set_header OpenBot-App-Version $http_openbot_app_version;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    location ^~ /v2/ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass http://openbot_web_ui;
        proxy_http_version 1.1;

        # The event socket of the Team API lives under this prefix too.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_address_or_loopback;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header OpenBot-Protocol-Version $http_openbot_protocol_version;
        proxy_set_header OpenBot-App-Version $http_openbot_app_version;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }
}
