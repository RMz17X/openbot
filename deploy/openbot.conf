# OpenBot Web UI reverse proxy configuration
# Serves static web client assets and reverse proxies Team API v1 and v2 routes.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_origin $cors_origin {
    default $http_origin;
    "" "$scheme://$http_host";
}

# The Team API listens on a free loopback port (src/main/listen-loopback.ts uses port 0), so the
# port changes on every daemon start. deploy/openbot-team-api-port.sh writes this file by probing
# the openbot process for the port whose /v1/compatibility answers with an appVersion body.
include /etc/nginx/upstream-openbot-team-api.conf;

server {
    listen 80;
    server_name _;

    # Static web client build directory (apps/webui/dist)
    root /var/www/openbot-webui;
    index index.html;

    client_max_body_size 50M;

    # Gzip Compression for lightning-fast asset loading
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Team API v1 routes
    location /v1/ {
        # Preflight OPTIONS handler
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }

        # CORS response headers
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        # Security headers
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(), usb=()" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;

        # Proxy to the local Team API server (upstream port is discovered at runtime)
        proxy_pass http://openbot_team_api;
        proxy_http_version 1.1;

        # WebSocket and event stream headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The Team API answers 426 client_update_required when the client protocol headers are
        # missing. Pass them through unchanged instead of rewriting them here, so the browser
        # decides the protocol version and the API stays the single source of truth.
        proxy_set_header OpenBot-Protocol-Version $http_openbot_protocol_version;
        proxy_set_header OpenBot-App-Version $http_openbot_app_version;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Team API v2 routes
    location /v2/ {
        # Preflight OPTIONS handler
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }

        # CORS response headers
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        # Security headers
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(), usb=()" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;

        # Proxy to the local Team API server (upstream port is discovered at runtime)
        proxy_pass http://openbot_team_api;
        proxy_http_version 1.1;

        # WebSocket and event stream headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass the client protocol headers through unchanged, for the same reason as the v1 block.
        proxy_set_header OpenBot-Protocol-Version $http_openbot_protocol_version;
        proxy_set_header OpenBot-App-Version $http_openbot_app_version;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Static assets directory (/assets/*) - Immutable content-hashed bundles
    location /assets/ {
        try_files $uri =404;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(), usb=()" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Standalone WebUI Session bypass
    location = /api/browser/session {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 200 '{"user":{"id":"ede983af-d352-4c13-84d2-95afffb2bc4e","email":"rickicode@gmail.com","name":"Ricki","avatarUrl":null,"analyticsEnabled":false,"chatColor":null}}';
    }

    # Standalone WebUI Hosts bypass
    location = /api/browser/v2/remote/hosts/ {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 200 '{"hosts":[{"hostId":"fb1996c0-9717-41c2-a0a9-fcc201941165","name":"1. OpenTop","logoKey":null,"devicePublicKey":"MCowBQYDK2VwAyEAPLRWsBB1lKwHd2OaMpybKat8RMhm4vTBGKuOQSyJAkA=","keyHandovers":[],"authEpoch":1,"membershipId":"55f9ad32-35aa-4aa1-a40d-9a4391d77814","role":"owner"}]}';
    }

    # Standalone WebUI generic browser API catch-all
    location /api/browser/ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-OpenBot-Browser" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 200 '{}';
    }

    # Static web client entry point and SPA fallback
    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(), usb=()" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
    }
}
