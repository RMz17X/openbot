<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>OpenBot</title>
    <!--
      The saved theme before the first paint. Without it, the page paints dark until the code of
      the web client runs. The script is the same one the Worker route sends in its head.
    -->
    <script>
      // Polyfill crypto.randomUUID for non-secure HTTP origins (e.g. LAN/Tailscale IP access)
      if (typeof window !== "undefined") {
        if (!window.crypto) {
          window.crypto = {};
        }
        if (typeof window.crypto.randomUUID !== "function") {
          window.crypto.randomUUID = () => {
            if (typeof window.crypto.getRandomValues === "function") {
              return ("" + 1e7 + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, (c) => (c ^ (window.crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16));
            }
            return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
              var r = (Math.random() * 16) | 0;
              var v = c === "x" ? r : (r & 0x3) | 0x8;
              return v.toString(16);
            });
          };
        }
      }
      try {
        let scheme = localStorage.getItem("openbot.web.appearance");
        if (scheme === "system") {
          scheme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        if (scheme === "light" || scheme === "dark") {
          document.documentElement.dataset.openbotColorScheme = scheme;
        }
      } catch {
        // A browser that blocks storage keeps the dark default.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>This page needs JavaScript.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
